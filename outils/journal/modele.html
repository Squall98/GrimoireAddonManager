<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITRE__</title>
<style>
[hidden]{display:none!important}
:root{--fond:#f4efe4;--carte:#fffaf0;--texte:#2b1d0e;--doux:#7a6a52;--bord:#e0d2b4;--or:#a8801e;--rouge:#b3261e;--code:#f6efdf}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--fond:#140d0a;--carte:#1f1510;--texte:#f1e2c0;--doux:#a8977a;--bord:#3a2a1c;--or:#d6b25e;--rouge:#e0574c;--code:#120b08}}
:root[data-theme=dark]{--fond:#140d0a;--carte:#1f1510;--texte:#f1e2c0;--doux:#a8977a;--bord:#3a2a1c;--or:#d6b25e;--rouge:#e0574c;--code:#120b08}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:15px/1.5 system-ui,Segoe UI,sans-serif}
header{padding:18px 24px;border-bottom:2px solid var(--or);background:var(--carte);display:flex;gap:16px;align-items:center;flex-wrap:wrap}
h1{margin:0;font:600 22px Georgia,serif;color:var(--or);flex:1}
.sous{color:var(--doux);font-size:13px;width:100%}
button,select,input{font:inherit;color:var(--texte);background:var(--fond);border:1px solid var(--bord);border-radius:8px;padding:6px 10px}
button{cursor:pointer}button:hover{border-color:var(--or)}
main{max-width:1100px;margin:0 auto;padding:18px 24px 40px}
.chiffres{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chiffre{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:10px 16px;min-width:150px}
.chiffre b{display:block;font-size:26px;color:var(--or)}
.outils{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.outils input[type=search]{flex:1;min-width:220px}
.onglets{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--bord);padding-bottom:8px}
.onglet{border-radius:20px;padding:4px 12px;font-size:13px}
.onglet.actif{background:var(--or);color:var(--fond);border-color:var(--or)}
.onglet .n{opacity:.7;margin-left:4px}
.erreur{background:var(--carte);border:1px solid var(--bord);border-left:4px solid var(--rouge);border-radius:10px;margin:10px 0;padding:12px 14px}
.erreur .haut{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.addon{font-weight:700;color:var(--or)}
.lieu{font-family:Consolas,monospace;font-size:13px;color:var(--doux)}
.fois{margin-left:auto;background:var(--rouge);color:#fff;border-radius:12px;padding:0 9px;font-size:13px;font-weight:700}
.msg{font-family:Consolas,monospace;margin:6px 0;white-space:pre-wrap;word-break:break-word}
.meta{color:var(--doux);font-size:12.5px}
.combat{color:var(--rouge);font-weight:600}
details{margin-top:6px}summary{cursor:pointer;color:var(--doux);font-size:13px}
pre{background:var(--code);border:1px solid var(--bord);border-radius:8px;padding:10px;overflow:auto;font-size:12.5px;white-space:pre-wrap}
.vide{text-align:center;color:var(--doux);padding:40px;font-size:18px}
.pied{color:var(--doux);font-size:12px;margin-top:24px}
</style>
</head>
<body>
<header>
  <h1 id="titre"></h1>
  <button id="copierTout"></button>
  <button id="theme"></button>
  <div class="sous" id="sous"></div>
</header>
<main>
  <div class="chiffres" id="chiffres"></div>
  <div class="onglets" id="onglets"></div>
  <div class="outils">
    <input type="search" id="recherche">
    <select id="tri"></select>
    <label><input type="checkbox" id="combat"> <span id="txtCombat"></span></label>
  </div>
  <div id="liste"></div>
  <p class="pied" id="pied"></p>
</main>
<script>
const D = __DONNEES__, T = D.textes;
const E = D.erreurs || [];
let addonActif = '', q = '', tri = 'derniere', combatSeul = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const date = s => s ? new Date(s * 1000).toLocaleString('fr-FR') : '?';
const fmt = (t, o) => t.replace(/\{(\w+)\}/g, (_, k) => o[k] ?? '?');
function texte(e) {
  return `${e.addon} — ${e.fichier}:${e.ligne} (${e.n}${T.fois})\n${e.message}\n${T.premiere} ${date(e.premiere)} · ${T.derniere} ${date(e.derniere)}${e.combat ? ' · ' + T.combat : ''}\n${fmt(T.infos, e)}\n${e.pile || ''}`;
}
function copier(t, b) { navigator.clipboard.writeText(t).then(() => { const v = b.textContent; b.textContent = T.copie; setTimeout(() => b.textContent = v, 1200); }); }
function rendre() {
  const parAddon = {};
  E.forEach(e => (parAddon[e.addon] ||= []).push(e));
  const total = E.reduce((a, e) => a + (e.n || 1), 0);
  $('chiffres').innerHTML = `<div class="chiffre"><b>${E.length}</b>${T.erreurs}</div><div class="chiffre"><b>${total}</b>${T.repetitions}</div><div class="chiffre"><b>${Object.keys(parAddon).length}</b>${T.addons}</div>`;
  $('onglets').innerHTML = [['', T.tous, E.length]].concat(Object.keys(parAddon).sort().map(a => [a, a, parAddon[a].length]))
    .map(([k, t, n]) => `<button class="onglet ${addonActif === k ? 'actif' : ''}" data-a="${esc(k)}">${esc(t)}<span class="n">${n}</span></button>`).join('');
  const ql = q.toLowerCase();
  let l = E.filter(e => (!addonActif || e.addon === addonActif) && (!combatSeul || e.combat) &&
    (!ql || [e.addon, e.fichier, e.message, e.pile].join(' ').toLowerCase().includes(ql)));
  const cle = {derniere: e => -(e.derniere || 0), nombre: e => -(e.n || 0), addon: e => e.addon + e.fichier};
  l.sort((a, b) => cle[tri](a) < cle[tri](b) ? -1 : cle[tri](a) > cle[tri](b) ? 1 : 0);
  $('liste').innerHTML = l.length ? l.map((e, i) => `<div class="erreur">
    <div class="haut"><span class="addon">${esc(e.addon)}</span><span class="lieu">${esc(e.fichier)}:${esc(e.ligne)}</span><span class="fois">${e.n || 1}${T.fois}</span></div>
    <div class="msg">${esc(e.message)}</div>
    <div class="meta">${T.premiere} ${date(e.premiere)} · ${T.derniere} ${date(e.derniere)}${e.combat ? ` · <span class="combat">${T.combat}</span>` : ''}<br>${esc(fmt(T.infos, e))}</div>
    <details><summary>${T.pile}</summary><pre>${esc(e.pile)}</pre></details>
    <button data-c="${E.indexOf(e)}" style="margin-top:6px">${T.copier}</button></div>`).join('') : `<p class="vide">${E.length ? T.aucun_resultat : T.aucune}</p>`;
}
$('titre').textContent = T.titre;
$('sous').textContent = fmt(T.sous_titre, D);
$('pied').textContent = fmt(T.lecture_seule, {empreinte: (D.empreinte || '-').slice(0, 16)});
$('recherche').placeholder = T.recherche;
$('txtCombat').textContent = T.filtre_combat;
$('copierTout').textContent = T.copier_tout;
$('theme').textContent = T.theme;
$('tri').innerHTML = [['derniere', T.tri_derniere], ['nombre', T.tri_nombre], ['addon', T.tri_addon]].map(([v, t]) => `<option value="${v}">${t}</option>`).join('');
$('onglets').onclick = e => { const b = e.target.closest('[data-a]'); if (b) { addonActif = b.dataset.a; rendre(); } };
$('liste').onclick = e => { const b = e.target.closest('[data-c]'); if (b) copier(texte(E[+b.dataset.c]), b); };
$('recherche').oninput = e => { q = e.target.value; rendre(); };
$('tri').onchange = e => { tri = e.target.value; rendre(); };
$('combat').onchange = e => { combatSeul = e.target.checked; rendre(); };
$('copierTout').onclick = e => copier(E.map(texte).join('\n\n----\n\n'), e.target);
const r = document.documentElement;
try { const t = localStorage.getItem('journal:theme'); if (t) r.dataset.theme = t; } catch (x) {}
$('theme').onclick = () => { const s = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.dataset.theme = s ? 'light' : 'dark'; try { localStorage.setItem('journal:theme', r.dataset.theme); } catch (x) {} };
rendre();
</script>
</body>
</html>
